<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Responsable — Suivi du temps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bleu:       #1e3a5f;
  --bleu-clair: #2d5a8e;
  --bleu-pale:  #e8f0fb;
  --bleu-mid:   #c5d8f5;
  --fond:       #f4f6fa;
  --blanc:      #ffffff;
  --texte:      #0f1f33;
  --texte2:     #4a5e75;
  --texte3:     #8a9db5;
  --rouge:      #c0392b;
  --vert:       #1a7a4a;
  --vert-pale:  #e6f5ee;
  --orange:     #c8621a;
  --orange-pale:#fff0e4;
  --radius:     12px;
  --shadow:     0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: "DM Sans", sans-serif; background: var(--fond); color: var(--texte); min-height: 100vh; }
.header { background: var(--bleu); color: white; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-logo { width: 32px; height: 32px; background: rgba(255,255,255,.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.header-title { font-size: 16px; font-weight: 600; opacity: .95; }
.header-sub { font-size: 12px; opacity: .5; margin-top: 1px; }
.header-info { font-size: 13px; opacity: .7; text-align: right; }
.header-info strong { display: block; opacity: 1; }
.main { padding: 32px; max-width: 1100px; margin: 0 auto; }
.card { background: var(--blanc); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
.card-header { padding: 18px 24px; border-bottom: 1px solid #e8f0f8; display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 15px; font-weight: 600; color: var(--texte); }
.card-body { padding: 24px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: none; font-family: "DM Sans", sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; }
.btn-primary { background: var(--bleu); color: white; }
.btn-primary:hover { background: var(--bleu-clair); }
.btn-secondary { background: var(--bleu-pale); color: var(--bleu); }
.btn-secondary:hover { background: var(--bleu-mid); }
.btn-warning { background: var(--orange-pale); color: var(--orange); }
.btn-warning:hover { background: #ffe0c8; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--texte3); border-bottom: 1px solid #e8f0f8; background: #fafcff; white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid #f0f4f8; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafcff; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; }
.badge-actif { background: var(--vert-pale); color: var(--vert); }
.badge-actif::before { background: var(--vert); }
.badge-inactif { background: #f0f0f0; color: #888; }
.badge-inactif::before { background: #bbb; }
.badge-attente { background: var(--orange-pale); color: var(--orange); }
.badge-attente::before { background: var(--orange); }
.badge-gelee { background: #e8f0fb; color: #2d5a8e; }
.badge-gelee::before { background: #2d5a8e; }
.recap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.stat-card { background: var(--bleu-pale); border-radius: var(--radius); padding: 16px 20px; }
.stat-num { font-family: "DM Mono", monospace; font-size: 32px; font-weight: 500; color: var(--bleu); line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--texte2); margin-top: 4px; }
.alerte-row td { background: #fff8f5 !important; }
.alerte-badge { color: var(--orange); font-size: 13px; font-weight: 500; }
.loader { display: flex; align-items: center; justify-content: center; padding: 48px; gap: 12px; color: var(--texte3); }
.spinner { width: 24px; height: 24px; border: 2px solid #dce6f0; border-top-color: var(--bleu); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-banner { background: #fdecea; border: 1px solid #f5c6c2; border-radius: 10px; padding: 14px 18px; color: var(--rouge); font-size: 14px; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bleu); }
.login-box { background: white; border-radius: 20px; padding: 40px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center; }
.login-logo { font-size: 40px; margin-bottom: 16px; }
.login-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--texte3); margin-bottom: 28px; }
.login-error { background: #fdecea; color: var(--rouge); border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 12px; }
.form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
label { font-size: 12px; font-weight: 600; color: var(--texte2); text-transform: uppercase; letter-spacing: .05em; }
input { padding: 9px 12px; border: 1.5px solid #dce6f0; border-radius: 8px; font-family: "DM Sans", sans-serif; font-size: 14px; color: var(--texte); background: white; outline: none; transition: border-color .15s; width: 100%; }
input:focus { border-color: var(--bleu-clair); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 500; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-lg { background: white; border-radius: 16px; width: min(1200px, 96vw); box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-header { padding: 20px 24px; border-bottom: 1px solid #e8f0f8; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--texte3); line-height: 1; padding: 4px; }
.modal-body { padding: 24px; max-height: 72vh; overflow-y: auto; overflow-x: auto; }
.modal-footer { padding: 16px 24px; border-top: 1px solid #e8f0f8; display: flex; justify-content: flex-end; }
.save-msg { font-size: 12px; margin-top: 3px; display: none; }
</style>
</head>
<body>
<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <div class="login-logo">🌱</div>
    <div class="login-title">Espace Responsable</div>
    <div class="login-sub">Chants de la Terre — Suivi du temps</div>
    <div class="form-group">
      <label>Token d'accès</label>
      <input type="password" id="login-token" placeholder="Votre token responsable" onkeydown="if(event.key==='Enter') login()">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;justify-content:center;" onclick="login()">Accéder</button>
    <div class="login-error" id="login-error" style="display:none"></div>
  </div>
</div>
<div id="app" style="display:none">
  <div class="header">
    <div class="header-brand">
      <div class="header-logo">🌱</div>
      <div>
        <div class="header-title">Espace Responsable</div>
        <div class="header-sub">Chants de la Terre</div>
      </div>
    </div>
    <div class="header-info" style="display:flex;align-items:center;gap:12px;">
      <div style="text-align:right;">
        <strong id="header-equipe">—</strong>
        <span id="header-responsable"></span>
      </div>
      <a href="https://chantsdelaterre.github.io/suivi-temps/" onclick="const t=document.cookie.match('cdt_token=([^;]+)');if(t)this.href='https://chantsdelaterre.github.io/suivi-temps/?id='+t[1];return true;" style="background:rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;font-size:12px;color:white;text-decoration:none;white-space:nowrap;" onclick="this.textContent='⏳...';this.style.opacity='.6'">← Mon appli</a>
    </div>
  </div>
  <div class="main">
    <div class="card" style="margin-bottom:20px">
      <div class="card-header">
        <span class="card-title" id="recap-titre">Mon équipe — 30 derniers jours</span>
      </div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Collaborateur</th>
              <th>Voir</th>
              <th style="text-align:right">H/sem</th>
              <th>Dernière saisie</th>
              <th style="text-align:right">Heures</th>
            </tr>
          </thead>
          <tbody id="recap-tbody">
            <tr><td colspan="5"><div class="loader"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal-saisies">
  <div class="modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="saisies-titre">Saisies</span>
      <button class="modal-close" onclick="fermerSaisies()">×</button>
    </div>
    <div class="modal-body" id="saisies-body">
      <div class="loader"><div class="spinner"></div>Chargement…</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fermerSaisies()">Fermer</button>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://oldkmapumqnibdcniecd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sMySTPpkgaiUtnban8uCtw_HQFxmsgv';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let MANAGER_TOKEN = new URLSearchParams(location.search).get('token') || '';
let recapData = [];
let equipeCollabs = [];
let managerEquipe = null;

function fmtHeure(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^\d{1,2}:\d{2}$/.test(s)) return s.padStart(5,'0');
  if (s.includes('T')) {
    const d = new Date(s);
    if (!isNaN(d)) {
      const totalMin = d.getUTCHours() * 60 + d.getUTCMinutes() + Math.round(d.getUTCSeconds() / 60);
      const rounded = Math.round(totalMin / 5) * 5;
      const h = String(Math.floor(rounded / 60) % 24).padStart(2,'0');
      const m = String(rounded % 60).padStart(2,'0');
      return h + ':' + m;
    }
  }
  return '';
}

async function login() {
  const token = document.getElementById('login-token').value.trim();
  if (!token) return;
  MANAGER_TOKEN = token;
  const { data: equipe, error } = await sb
    .from('equipes').select('*').eq('manager_token', token).maybeSingle();
  if (error || !equipe) {
    document.getElementById('login-error').textContent = error ? 'Erreur de connexion.' : 'Accès refusé.';
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  managerEquipe = equipe;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  charger30j();
}

if (MANAGER_TOKEN) { document.getElementById('login-token').value = MANAGER_TOKEN; login(); }

async function charger30j() {
  document.getElementById('recap-tbody').innerHTML = '<tr><td colspan="5"><div class="loader"><div class="spinner"></div></div></td></tr>';
  const eq = managerEquipe;
  if (!eq) return;
  document.getElementById('header-equipe').textContent = eq.nom_equipe || 'Mon équipe';

  // Collabs actifs de l'équipe
  const { data: collabs, error: ec } = await sb
    .from('collaborateurs').select('*').eq('equipe_id', eq.equipe_id);
  if (ec) { document.getElementById('recap-tbody').innerHTML = '<tr><td colspan="5" style="color:var(--rouge);padding:24px">Erreur de chargement.</td></tr>'; return; }
  const actifs = (collabs || []).filter(c => c.actif === true || c.actif === 'TRUE' || c.actif === 1);
  const ids = actifs.map(c => c.collab_id);

  // Jours des 30 derniers jours pour ces collabs (un seul fetch)
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const d30ISO = String(d30.getFullYear()) + '-' + String(d30.getMonth()+1).padStart(2,'0') + '-' + String(d30.getDate()).padStart(2,'0');
  let jours = [];
  if (ids.length) {
    const { data: dj } = await sb.from('jours').select('*')
      .in('collab_id', ids).gte('date_jour', d30ISO).order('date_jour', {ascending:false});
    jours = dj || [];
  }

  // Mapping snake→camel + groupage par collab (jours embarqués pour la modale "Voir")
  const fmtISO = iso => { if (!iso) return ''; const p = String(iso).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : String(iso); };
  const parCollab = {};
  jours.forEach(j => {
    (parCollab[j.collab_id] ||= []).push({
      jourId: j.jour_id, dateJour: fmtISO(j.date_jour), jourSemaine: j.jour_semaine, typeJour: j.type_jour,
      c1Debut: j.c1_debut||'', c1Fin: j.c1_fin||'', c2Debut: j.c2_debut||'', c2Fin: j.c2_fin||'',
      c3Debut: j.c3_debut||'', c3Fin: j.c3_fin||'', totalHeures: j.total_heures, totalHebdoProg: j.total_hebdo_prog,
      commentaire: j.commentaire||'', remarqueManager: j.remarque_manager||'', _dateISO: String(j.date_jour).slice(0,10)
    });
  });

  // Agrégats à la volée (PAS de total_hebdo_prog stocké) — logique du Récap admin-v2
  equipeCollabs = actifs.map(c => {
    const js = parCollab[c.collab_id] || [];
    const totalHeures = js.reduce((s,j) => s + (Number(j.totalHeures)||0), 0);
    const saisis = js.filter(j => (j.c1Debut||j.c2Debut||j.c3Debut) || ['CP','AT','CS'].includes(j.typeJour));
    const derniereISO = saisis.length ? saisis.map(j => j._dateISO).sort().slice(-1)[0] : '';
    return {
      collabId: c.collab_id,
      nomAffiche: c.nom_affiche || ((c.prenom||'') + ' ' + (c.nom||'')).trim(),
      heuresHebdo: c.heures_hebdo,
      totalHeures: totalHeures,
      derniereSaisie: derniereISO ? fmtISO(derniereISO) : '—',
      jours: js
    };
  });

  // Rendu — identique à l'existant (non touché)
  const sorted = [...equipeCollabs].sort((a, b) => a.nomAffiche.localeCompare(b.nomAffiche));
  document.getElementById('recap-tbody').innerHTML = sorted.length === 0
    ? '<tr><td colspan="5" style="text-align:center;color:var(--texte3);padding:32px">Aucun collaborateur dans cette équipe.</td></tr>'
    : sorted.map(c => '<tr><td><strong>'+c.nomAffiche+'</strong></td><td><button class="btn btn-warning btn-sm" onclick="ouvrirSaisies(&quot;'+c.collabId+'&quot;, this)">Voir</button></td><td style="text-align:right">'+(c.heuresHebdo?c.heuresHebdo+'h':'—')+'</td><td style="font-size:13px;color:var(--texte2)">'+(c.derniereSaisie||'—')+'</td><td style="text-align:right"><span style="font-family:monospace;font-weight:500">'+Number(c.totalHeures).toFixed(2)+'h</span></td></tr>').join('');
}

function fermerSaisies() {
  document.getElementById('modal-saisies').classList.remove('open');
}

function ouvrirSaisies(collabId, btn) {
  const nomAffiche = btn.closest('tr').querySelector('td strong').textContent;
  document.getElementById('saisies-titre').textContent = 'Saisies — ' + nomAffiche;
  document.getElementById('modal-saisies').classList.add('open');
  const collab = equipeCollabs.find(c => c.collabId === collabId);
  renderSaisies(collab ? collab.jours : [], collabId);
}

function renderSaisies(jours, collabId) {
  const body = document.getElementById('saisies-body');
  // Jours "saisis" uniquement (jour travaillé avec heures, ou CP/AT/CS)
  const joursVus = (jours || []).filter(j => (Number(j.totalHeures) > 0) || ['CP','AT','CS'].includes(j.typeJour));
  if (!joursVus.length) {
    body.innerHTML = '<div style="text-align:center;color:var(--texte3);padding:40px">Aucune saisie pour cette période.</div>';
    return;
  }
  // Helpers date (clé locale, pas de toISOString → pas de décalage UTC)
  const keyLocal = dt => String(dt.getFullYear()) + String(dt.getMonth()+1).padStart(2,'0') + String(dt.getDate()).padStart(2,'0');
  const toDate = s => { const p=(s||'').split('/'); return p.length===3 ? new Date(p[2], p[1]-1, p[0]) : new Date(s); };
  // Cumul hebdo progressif (lundi → jour inclus), par jourId, somme par plage de clés
  const meta = joursVus.map(j => { const d = toDate(j.dateJour); return { j, d, key: isNaN(d) ? null : keyLocal(d) }; });
  const cumulById = {};
  meta.forEach(({ j, d, key }) => {
    if (!key || isNaN(d)) { cumulById[j.jourId] = null; return; }
    const dow = d.getDay() === 0 ? 6 : d.getDay() - 1;
    const lundi = new Date(d); lundi.setDate(d.getDate() - dow);
    const lundiKey = keyLocal(lundi);
    let cumul = 0;
    meta.forEach(m => { if (m.key && m.key >= lundiKey && m.key <= key) cumul += Number(m.j.totalHeures) || 0; });
    cumulById[j.jourId] = cumul;
  });
  // Remap des types (vocabulaire Supabase) — badges cohérents
  const TYPE_INFO = {
    'travaillée': { cls:'badge-actif',   lbl:'Travaillée' },
    'CP':         { cls:'badge-attente', lbl:'Congé payé' },
    'AT':         { cls:'badge-inactif', lbl:'Arrêt travail' },
    'CS':         { cls:'badge-gelee',   lbl:'Congé spécial' }
  };
  const typeBadge = t => { const i = TYPE_INFO[t] || { cls:'badge-inactif', lbl: t || '—' }; return '<span class="badge '+i.cls+'">'+i.lbl+'</span>'; };
  const cren = (deb, fin) => (fmtHeure(deb) && fmtHeure(fin)) ? fmtHeure(deb)+' → '+fmtHeure(fin) : '—';
  const th = s => '<th style="text-align:left;padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--texte3);border-bottom:1px solid #e8f0f8;background:#fafcff;white-space:nowrap">'+s+'</th>';
  const td = (content, extra) => '<td style="padding:8px 10px;border-bottom:1px solid #f0f4f8;'+(extra||'')+'">'+content+'</td>';

  const rows = joursVus.map((j, idx) => {
    const d = toDate(j.dateJour);
    const dow = isNaN(d) ? -1 : d.getDay();
    const bg = dow===6 ? 'background:#fff8f0;' : dow===0 ? 'background:#fff0f0;' : '';
    const cumul = cumulById[j.jourId];
    const cumulTxt = cumul != null ? cumul.toFixed(2)+'h' : '—';
    const totalTxt = (j.totalHeures != null && j.totalHeures !== '') ? Number(j.totalHeures).toFixed(2)+'h' : '—';
    const jourId = (j.jourId||'').replace(/'/g,'');
    const hasRem = j.remarqueManager && String(j.remarqueManager).trim();
    const remVal = (j.remarqueManager||'').replace(/"/g,'&quot;');
    return '<tr style="'+bg+'">'
      + td('<strong>'+(j.dateJour||'—')+'</strong><div style="font-size:11px;color:var(--texte3)">'+(j.jourSemaine||'')+'</div>', 'white-space:nowrap')
      + td(typeBadge(j.typeJour))
      + td(cren(j.c1Debut,j.c1Fin), 'font-family:monospace;font-size:12px;white-space:nowrap')
      + td(cren(j.c2Debut,j.c2Fin), 'font-family:monospace;font-size:12px;white-space:nowrap')
      + td(cren(j.c3Debut,j.c3Fin), 'font-family:monospace;font-size:12px;white-space:nowrap')
      + td('<span style="font-family:monospace;font-weight:600;color:var(--bleu)">'+totalTxt+'</span>')
      + td('<span style="font-family:monospace;color:var(--texte2)">'+cumulTxt+'</span>')
      + td('<span style="font-size:12px;color:var(--texte2)">'+(j.commentaire||'—').replace(/</g,'&lt;')+'</span>')
      + '<td style="padding:6px 10px;border-bottom:1px solid #f0f4f8">'
      + '<div style="display:flex;align-items:center;gap:6px">'
      + '<input type="text" id="j'+idx+'-rem" value="'+remVal+'" placeholder="Ajouter une remarque…" style="flex:1;min-width:180px;font-size:12px;padding:5px 8px;'+(hasRem?'border-color:var(--orange);background:var(--orange-pale)':'')+'">'
      + '<button class="btn btn-warning btn-sm" onclick="sauverRemarque('+idx+',\''+jourId+'\')">Enregistrer</button>'
      + '</div>'
      + '<div class="save-msg" id="jmsg-'+idx+'"></div>'
      + '</td></tr>';
  }).join('');

  body.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px">'
    + '<thead style="position:sticky;top:-1px;z-index:2;box-shadow:0 1px 0 #e8f0f8"><tr>'
    + th('Date') + th('Type') + th('Matin') + th('Après-midi') + th('Créneau 3') + th('Total') + th('Cumul sem.') + th('Commentaire') + th('Remarque responsable')
    + '</tr></thead><tbody>'
    + rows
    + '</tbody></table>';
}

async function sauverRemarque(idx, jourId) {
  const msg = document.getElementById('jmsg-'+idx);
  const inp = document.getElementById('j'+idx+'-rem');
  const remarque = (inp?.value || '').trim();
  if (msg) msg.style.display = 'none';

  const { data, error } = await sb.functions.invoke('sauver-remarque', {
    body: { jour_id: jourId, remarque, manager_token: MANAGER_TOKEN }
  });

  if (!msg) return;
  msg.style.display = 'block';

  // Erreur HTTP renvoyee par la fonction (401 / 403 / 404 / 500)
  if (error) {
    let detail = error.message || 'Enregistrement impossible.';
    try {
      const body = await error.context.json();
      if (body?.error) detail = body.error;
    } catch (_) {}
    msg.style.color = 'var(--rouge)';
    msg.textContent = '✗ ' + detail;
    return;
  }

  if (!data || data.ok !== true) {
    msg.style.color = 'var(--rouge)';
    msg.textContent = '✗ ' + ((data && data.error) || 'Remarque non enregistrée.');
    return;
  }

  msg.style.color = 'var(--vert)';
  msg.textContent = '✓ Remarque enregistrée';
  if (inp) { inp.style.borderColor = remarque ? 'var(--orange)' : ''; inp.style.background = remarque ? 'var(--orange-pale)' : ''; }
}
</script>
</body>
</html>
