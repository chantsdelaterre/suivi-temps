<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a3a1a">
    <link rel="manifest" href="/suivi-temps/manifest.json">
    <link rel="apple-touch-icon" href="/suivi-temps/icon-192.png">
    <title>Suivi du temps</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
    :root {
        --vert: #2d5a2d;
        --vert-clair: #4a8c4a;
        --vert-pale: #e8f2e8;
        --fond: #f5f2ed;
        --blanc: #ffffff;
        --texte: #1a2e1a;
        --texte2: #5a6e5a;
        --texte3: #8a9e8a;
        --vide: #c8d8c8;
        --rouge: #c0392b;
        --radius: 16px;
    }
    body.theme-pourpre {
        --vert: #4a1628;
        --vert-clair: #6b2040;
        --vert-pale: #fbeaf0;
        --fond: #fdf5f8;
        --texte: #2a0e18;
        --texte2: #7a3050;
        --texte3: #b07090;
        --vide: #e8c0d0;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        font-family: 'DM Sans', sans-serif;
        background: var(--fond);
        color: var(--texte);
        min-height: 100vh;
        width: 100%;
    }

    .header {
        background: var(--vert);
        color: white;
        padding: 48px 24px 20px;
        position: relative;
        overflow: hidden;
    }

    .header::before {
        content: '';
        position: absolute;
        top: -40px;
        right: -40px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(255, 255, 255, .05);
    }

    .header-company {
        font-size: 11px;
        letter-spacing: .1em;
        text-transform: uppercase;
        opacity: .6;
        margin-bottom: 4px;
    }

    .header-name {
        font-size: 28px;
        font-weight: 600;
        line-height: 1.1;
    }

    .header-date {
        font-size: 14px;
        opacity: .7;
        margin-top: 6px;
    }

    .header-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(255, 255, 255, .12);
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 12px;
        margin-top: 10px;
    }

    .header-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7ed87e;
    }

    .main {
        padding: 16px 16px 100px;
    }

    .block {
        background: var(--blanc);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 10px;
    }

    .block-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--texte3);
        margin-bottom: 12px;
    }

    .time-big {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 6px 0;
    }

    .time-val {
        font-family: 'DM Mono', monospace;
        font-size: 36px;
        font-weight: 500;
        color: var(--texte);
        line-height: 1;
    }

    .time-val.empty {
        color: var(--vide);
    }

    .time-sep {
        font-size: 20px;
        color: var(--texte3);
    }

    .time-sep.empty {
        color: var(--vide);
    }

    .total-block {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 14px 18px;
        background: var(--blanc);
        border-radius: var(--radius);
        margin-bottom: 10px;
    }

    .total-lbl {
        font-size: 14px;
        color: var(--texte2);
    }

    .total-num {
        font-family: 'DM Mono', monospace;
        font-size: 40px;
        font-weight: 500;
        color: var(--vert);
        line-height: 1;
    }

    .total-num.empty {
        color: var(--vide);
    }

    .total-unit {
        font-size: 16px;
        color: var(--texte3);
        margin-left: 3px;
    }

    .type-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 20px;
        padding: 5px 12px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 14px;
    }

    .pill-travaillee {
        background: var(--vert-pale);
        color: var(--vert);
    }

    .pill-vide {
        background: #edeae4;
        color: var(--texte3);
    }

    .pill-cp {
        background: #e8f0ff;
        color: #3358c4;
    }

    .pill-at {
        background: #fff0e8;
        color: #8b5e3c;
    }

    .btn {
        width: 100%;
        padding: 17px;
        border-radius: var(--radius);
        border: none;
        font-family: 'DM Sans', sans-serif;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: transform .1s, opacity .1s;
    }

    .btn:active {
        transform: scale(.98);
        opacity: .9;
    }

    .btn-primary {
        background: var(--vert);
        color: white;
    }

    .btn-secondary {
        background: transparent;
        color: var(--vert);
        border: 1.5px solid var(--vert);
        margin-top: 8px;
    }

    .modif-count {
        text-align: center;
        font-size: 12px;
        color: var(--texte3);
        margin-top: 8px;
    }

    .alert {
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 14px;
        margin-bottom: 12px;
    }

    .alert-warn {
        background: #fff3cd;
        color: #856404;
    }

    .alert-max {
        background: #fff0e8;
        color: #8b5e3c;
    }

    .type-selector {
        display: flex;
        gap: 8px;
    }

    .type-btn {
        flex: 1;
        padding: 13px 8px;
        border-radius: 12px;
        border: 1.5px solid #edeae4;
        background: var(--blanc);
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        font-weight: 500;
        color: var(--texte2);
        cursor: pointer;
        text-align: center;
        transition: all .15s;
    }

    .type-btn.sel-travaillee {
        background: var(--vert-pale);
        border-color: var(--vert);
        color: var(--vert);
    }

    .type-btn.sel-cp {
        background: #e8f0ff;
        border-color: #3358c4;
        color: #3358c4;
    }

    .type-btn.sel-at {
        background: #fff0e8;
        border-color: #8b5e3c;
        color: #8b5e3c;
    }

    .time-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
    }

    .time-btn {
        flex: 1;
        background: var(--fond);
        border: none;
        border-radius: 12px;
        padding: 15px 8px;
        font-family: 'DM Mono', monospace;
        font-size: 24px;
        font-weight: 500;
        color: var(--texte);
        text-align: center;
        cursor: pointer;
        transition: background .15s;
    }

    .time-btn.empty-val {
        color: var(--vide);
    }

    .time-btn:active {
        background: #edeae4;
    }

    .time-sep2 {
        font-size: 18px;
        color: var(--texte3);
    }

    .add-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1.5px dashed var(--texte3);
        border-radius: 12px;
        padding: 12px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        color: var(--texte3);
        width: 100%;
        background: none;
        cursor: pointer;
        margin-top: 10px;
    }

    .textarea {
        width: 100%;
        padding: 14px;
        border: 1.5px solid #edeae4;
        border-radius: 12px;
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        color: var(--texte);
        background: var(--blanc);
        outline: none;
        resize: none;
        line-height: 1.5;
    }

    .textarea:focus {
        border-color: var(--vert-clair);
    }

    .error-box {
        background: #fff0f0;
        border: 1px solid #fcc;
        border-radius: 12px;
        padding: 14px;
        font-size: 14px;
        color: var(--rouge);
        text-align: center;
        margin-bottom: 12px;
    }

    .jour-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--fond);
        cursor: pointer;
    }

    .jour-item:last-child {
        border-bottom: none;
    }

    .jour-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .dot-ok {
        background: var(--vert-clair);
    }

    .dot-vide {
        background: #edeae4;
        border: 1.5px solid var(--texte3);
    }

    .dot-special {
        background: #3358c4;
    }

    .jour-info {
        flex: 1;
    }

    .jour-nom {
        font-size: 16px;
        font-weight: 500;
    }

    .jour-date {
        font-size: 15px;
        color: var(--texte3);
        margin-top: 2px;
    }

    .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        gap: 16px;
        color: var(--texte3);
        font-size: 14px;
    }

    .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid #edeae4;
        border-top-color: var(--vert);
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--blanc);
        border-top: 1px solid rgba(0, 0, 0, .08);
        display: flex;
        padding: 8px 0 env(safe-area-inset-bottom, 16px);
        z-index: 100;
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 6px 0;
        cursor: pointer;
        color: var(--texte3);
        font-size: 11px;
        font-weight: 500;
        border: none;
        background: none;
        font-family: 'DM Sans', sans-serif;
    }

    .nav-item.active {
        color: var(--vert);
    }

    .nav-icon {
        font-size: 20px;
        line-height: 1;
    }

    .vue {
        display: none;
    }

    .vue.active {
        display: block;
    }

    #picker-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: transparent;
        z-index: 999;
    }

    #picker-overlay.open {
        display: block;
    }

    #picker-popup {
        display: none;
        position: absolute;
        top: 360px;            /* approximatif : cale la fenêtre sous le bloc Matin (à ajuster à l'œil) */
        left: 16px;
        right: 16px;
        background: var(--blanc);
        border-radius: 16px;
        z-index: 1000;
        box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
    }

    #picker-popup.open {
        display: block;
    }

    .picker-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px 12px;
    }

    .picker-cancel {
        background: none;
        border: none;
        font-size: 17px;
        color: var(--texte3);
        font-family: 'DM Sans', sans-serif;
        cursor: pointer;
        padding: 4px 8px;
    }

    .picker-preview {
        font-family: 'DM Mono', monospace;
        font-size: 28px;
        font-weight: 500;
        color: var(--texte);
    }

    .picker-ok {
        background: none;
        border: none;
        font-size: 17px;
        color: var(--vert);
        font-weight: 600;
        font-family: 'DM Sans', sans-serif;
        cursor: pointer;
        padding: 4px 8px;
    }

    .picker-drums {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 220px;
        position: relative;
    }

    .picker-drums::before {
        content: '';
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 160px;
        height: 52px;
        border-top: 2px solid var(--vert);
        border-bottom: 2px solid var(--vert);
        border-radius: 4px;
        z-index: 2;
        pointer-events: none;
    }

    .picker-drums::after {
        content: ':';
        position: absolute;
        font-family: 'DM Mono', monospace;
        font-size: 28px;
        font-weight: 500;
        color: var(--texte);
        z-index: 3;
        pointer-events: none;
    }

    .drum {
        flex: 1;
        overflow-y: scroll;
        height: 100%;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
    }

    .drum::-webkit-scrollbar {
        display: none;
    }

    .drum-item {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'DM Mono', monospace;
        font-size: 28px;
        font-weight: 500;
        scroll-snap-align: center;
        color: var(--texte);
    }

    .drum-spacer {
        height: 84px;
    }
    #toast-msg {
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--texte);
        color: var(--blanc);
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        z-index: 9999;
        opacity: 0;
        transition: opacity .3s;
        pointer-events: none;
        white-space: nowrap;
    }
    #toast-msg.warn {
        background: var(--rouge);
    }
    #toast-msg.show {
        opacity: 1;
    }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-company" id="hdr-company">Chants de la Terre</div>
        <div class="header-name" id="hdr-name">…</div>
        <a id="btn-mon-equipe" href="#" onclick="this.textContent='⏳ Chargement...';this.style.opacity='.6';setTimeout(()=>location.href=this.dataset.href,300);return false;" style="display:none;margin-top:10px;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;font-size:13px;color:white;text-decoration:none;">👥 Mon équipe</a>
        <div class="header-date" id="hdr-date">…</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;"><div class="header-badge" id="hdr-periode">…</div><button onclick="toggleThemePicker()" style="background:rgba(255,255,255,.15);border:none;border-radius:50%;width:26px;height:26px;font-size:13px;cursor:pointer;color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;" aria-label="Changer de thème">🎨</button></div>
        <div id="theme-picker" style="display:none;position:absolute;bottom:12px;right:12px;background:white;border-radius:12px;padding:8px 12px;box-shadow:0 4px 20px rgba(0,0,0,.2);align-items:center;gap:10px;z-index:100;">
          <span style="font-size:12px;color:#555;">Thème :</span>
          <button onclick="setTheme('vert')" style="width:24px;height:24px;border-radius:50%;background:#2d5a2d;border:2px solid transparent;cursor:pointer;" id="btn-theme-vert" aria-label="Thème vert"></button>
          <button onclick="setTheme('pourpre')" style="width:24px;height:24px;border-radius:50%;background:#4a1628;border:2px solid transparent;cursor:pointer;" id="btn-theme-pourpre" aria-label="Thème pourpre"></button>
        </div>
    </div>
    <div class="main">
        <div class="vue active" id="vue-journee">
            <div id="journee-content">
                <div class="loader">
                    <div class="spinner"></div>
                    Chargement…
                </div>
            </div>
        </div>
        <div class="vue" id="vue-formulaire">
            <div class="block">
                <div class="block-label">Type de journée</div>
                <div class="type-selector">
                    <button class="type-btn sel-travaillee" data-type="travaillée" onclick="selectType(this)">Travail</button>
                    <button class="type-btn" data-type="CP" onclick="selectType(this)">CP</button>
                    <button class="type-btn" data-type="AT" onclick="selectType(this)">AT</button>
                </div>
            </div>
            <div id="card-horaires" class="block">
                <div class="block-label">Matin</div>
                <div class="time-row">
                    <button class="time-btn empty-val" id="c1-debut" onclick="openPicker('c1-debut')">--:--</button>
                    <span class="time-sep2">→</span>
                    <button class="time-btn empty-val" id="c1-fin" onclick="openPicker('c1-fin')">--:--</button>
                </div>
                <div class="block-label" style="margin-top:14px">Après-midi</div>
                <div class="time-row">
                    <button class="time-btn empty-val" id="c2-debut" onclick="openPicker('c2-debut')">--:--</button>
                    <span class="time-sep2">→</span>
                    <button class="time-btn empty-val" id="c2-fin" onclick="openPicker('c2-fin')">--:--</button>
                </div>
                <div id="c3-section" style="display:none">
                    <div class="block-label" style="margin-top:14px">3e créneau</div>
                    <div class="time-row">
                        <button class="time-btn empty-val" id="c3-debut" onclick="openPicker('c3-debut')">--:--</button>
                        <span class="time-sep2">→</span>
                        <button class="time-btn empty-val" id="c3-fin" onclick="openPicker('c3-fin')">--:--</button>
                    </div>
                </div>
            </div>
            <div id="save-error" style="display:none" class="error-box"></div>
            <button class="btn btn-primary" id="btn-save" onclick="sauvegarder()">Enregistrer</button>
            <button class="btn btn-secondary" onclick="showVue('journee')" style="margin-bottom:10px">Annuler</button>
            <button class="add-btn" id="btn-add-c3" onclick="toggleC3()">+ Ajouter un créneau</button>
            <div class="block" style="margin-top:10px">
                <div class="block-label">Commentaire (optionnel)</div>
                <textarea class="textarea" id="commentaire" rows="2" placeholder="Remarque éventuelle…"></textarea>
            </div>
        </div>
        <div class="vue" id="vue-mesjours">
            <div id="mesjours-content">
                <div class="loader">
                    <div class="spinner"></div>
                    Chargement…
                </div>
            </div>
        </div>
    </div>
    <nav class="nav">
        <button class="nav-item active" id="nav-journee" onclick="showVue('journee')">
            <span class="nav-icon">☀️</span>
            Ma journée
              
        </button>
        <button class="nav-item" id="nav-mesjours" onclick="showVue('mesjours')">
            <span class="nav-icon">📅</span>
            Mes jours
              
        </button>
    </nav>
    <div id="toast-msg"></div>
    <div id="picker-overlay" onclick="cancelPicker()"></div>
    <div id="picker-popup">
        <div class="picker-head">
            <button class="picker-cancel" onclick="cancelPicker()">Annuler</button>
            <span class="picker-preview" id="picker-preview">08:00</span>
            <button class="picker-ok" onclick="confirmPicker()">OK</button>
        </div>
        <div class="picker-drums">
            <div class="drum" id="drum-h" onscroll="updatePreview()"></div>
            <div class="drum" id="drum-m" onscroll="updatePreview()"></div>
        </div>
    </div>
    <script>
    function getCookie(name) {
      const v = document.cookie.match('(^|;)\s*' + name + '\s*=\s*([^;]+)');
      return v ? v.pop() : '';
    }
    function setCookie(name, value) {
      document.cookie = name + '=' + value + ';path=/;max-age=31536000;SameSite=Lax';
    }
    const _urlToken = new URLSearchParams(location.search).get('id') || '';
    if (_urlToken) { setCookie('cdt_token', _urlToken); localStorage.setItem('cdt_token', _urlToken); }
    const COLLAB_ID = _urlToken || getCookie('cdt_token') || localStorage.getItem('cdt_token') || '';
    let COLLAB_ROLE = '';
    let COLLAB_EQUIPE_ID = '';
    function setTheme(t) {
      document.body.className = t === 'pourpre' ? 'theme-pourpre' : '';
      setCookie('cdt_theme', t);
      document.getElementById('btn-theme-vert').style.borderColor = t === 'vert' ? '#888' : 'transparent';
      document.getElementById('btn-theme-pourpre').style.borderColor = t === 'pourpre' ? '#888' : 'transparent';
      document.getElementById('theme-picker').style.display = 'none';
    }
    function toggleThemePicker() {
      const p = document.getElementById('theme-picker');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    }
    const _savedTheme = getCookie('cdt_theme') || 'vert';
    setTheme(_savedTheme);
    const API_URL = 'https://script.google.com/macros/s/AKfycbx1BTyA9scZnOy7cFKoif9KuV_PuEmotXtO5yCheB-IUESExdG5v5l3maZ-Wn-XBowwbg/exec';
    const SUPABASE_URL = 'https://oldkmapumqnibdcniecd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sMySTPpkgaiUtnban8uCtw_HQFxmsgv';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    function jsonpFetch(url) {
        return new Promise((resolve, reject) => {
            const cb = 'cb_' + Math.random().toString(36).slice(2);
            const script = document.createElement('script');
            window[cb] = (data) => {
                delete window[cb];
                document.head.removeChild(script);
                resolve(data);
            };
            script.src = url + '&callback=' + cb;

        showToast('✓ Enregistré');
        mesJoursCache = null;
        const timeoutId = setTimeout(() => {
            showToast('⚠️ Connexion lente — vérifiez votre réseau', true);
        }, 8000);
        try {
            // Vérifier nb_modifications depuis Supabase
            const { data: jourActuel } = await sb
                .from('jours')
                .select('nb_modifications')
                .eq('jour_id', jourData.jourId)
                .single();
            const nbModifs = jourActuel ? (jourActuel.nb_modifications || 0) : 0;
            if (nbModifs >= 3) {
                clearTimeout(timeoutId);
                showToast('⚠️ 3 modifications maximum atteintes', true);
                resetBtn();
                return;
            }
            // Calculer total_heures
            const totalH = calculTotal(payload);
            // Calculer total_hebdo_prog — lire les jours de la semaine depuis Supabase
            const _pDate = (jourData.dateJour||'').split('/');
            const dateJour = _pDate.length===3 ? new Date(_pDate[2], _pDate[1]-1, _pDate[0]) : new Date(jourData.dateJour);
            const dow = dateJour.getDay() === 0 ? 6 : dateJour.getDay() - 1;
            const lundi = new Date(dateJour);
            lundi.setDate(dateJour.getDate() - dow);
            const lundiISO = lundi.toISOString().slice(0, 10);
            const { data: joursSemaine } = await sb
                .from('jours')
                .select('total_heures, jour_id')
                .eq('collab_id', jourData.jourId.split('_')[0])
                .gte('date_jour', lundiISO);
            let hebdoProg = totalH;
            if (joursSemaine) {
                joursSemaine.forEach(j => {
                    if (j.jour_id !== jourData.jourId) {
                        hebdoProg += Number(j.total_heures) || 0;
                    }
                });
            }
            // Formatter la date de modification
            const now = new Date();
            const dateMod = now.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'})
                + ' ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})
                + ' (collab)';
            // UPDATE dans Supabase
            const isAbsence = ['CP','AT','CS'].includes(payload.typeJour);
            const { error: updateErr } = await sb
                .from('jours')
                .update({
                    type_jour: payload.typeJour,
                    c1_debut: isAbsence ? '' : (payload.c1Debut || ''),
                    c1_fin: isAbsence ? '' : (payload.c1Fin || ''),
                    c2_debut: isAbsence ? '' : (payload.c2Debut || ''),
                    c2_fin: isAbsence ? '' : (payload.c2Fin || ''),
                    c3_debut: isAbsence ? '' : (payload.c3Debut || ''),
                    c3_fin: isAbsence ? '' : (payload.c3Fin || ''),
                    commentaire: payload.commentaire || '',
                    total_heures: isAbsence ? 0 : totalH,
                    total_hebdo_prog: isAbsence ? hebdoProg - totalH : hebdoProg,
                    nb_modifications: nbModifs + 1,
                    date_derniere_modif: dateMod
                })
                .eq('jour_id', jourData.jourId);
            clearTimeout(timeoutId);
            if (updateErr) {
                showToast('⚠️ Erreur serveur — réessayez', true);
                resetBtn();
                return;
            }
            jourData = {
                ...jourData,
                nbModifications: nbModifs + 1,
                totalHeures: isAbsence ? 0 : totalH,
                typeJour: payload.typeJour,
                c1Debut: isAbsence ? '' : (payload.c1Debut || ''),
                c1Fin: isAbsence ? '' : (payload.c1Fin || ''),

            };
            renderJournee();
            prefetchMesJours();
        } catch (e) {
            clearTimeout(timeoutId);
            showToast('⚠️ Erreur réseau — réessayez', true);
            resetBtn();
        }
    }

    async function fetchMesJoursSupabase() {
        const { data: collab } = await sb.from('collaborateurs').select('collab_id, equipe_id').eq('token', COLLAB_ID).single();
        if (!collab) return null;
        const { data: jours } = await sb.from('jours').select('*').eq('collab_id', collab.collab_id).order('date_jour', {ascending: false}).limit(30);
        const { data: periode } = await sb.from('periodes').select('*').eq('statut', 'ouverte').single();
        const fmtISO = iso => { if (!iso) return ''; const d = new Date(iso); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear(); };
        const joursFormates = (jours||[]).map(j => ({
            jourId: j.jour_id,
            dateJour: fmtISO(j.date_jour),
            jourSemaine: j.jour_semaine,
            periodeId: j.periode_id,
            typeJour: j.type_jour,
            c1Debut: j.c1_debut || '',
            c1Fin: j.c1_fin || '',
            c2Debut: j.c2_debut || '',
            c2Fin: j.c2_fin || '',
            c3Debut: j.c3_debut || '',
            c3Fin: j.c3_fin || '',
            commentaire: j.commentaire || '',
            totalHeures: j.total_heures || 0,
            totalHebdoProg: j.total_hebdo_prog || 0,
            nbModifications: j.nb_modifications || 0
        }));
        const periodeFormatee = periode ? {
            periodeId: periode.periode_id,
            nomPeriode: periode.nom_periode,
            dateDebut: fmtISO(periode.date_debut),
            dateFin: fmtISO(periode.date_fin)
        } : null;
        return { ok: true, jours: joursFormates, periode: periodeFormatee };
    }
    function calculTotal(p) {
        let t = 0;
        if (p.c1Debut && p.c1Fin)
            t += diff(p.c1Debut, p.c1Fin);
        if (p.c2Debut && p.c2Fin)
            t += diff(p.c2Debut, p.c2Fin);
        if (p.c3Debut && p.c3Fin)
            t += diff(p.c3Debut, p.c3Fin);
        return t;
    }
    function diff(a, b) {
        const [h1, m1] = a.split(':').map(Number),
            [h2, m2] = b.split(':').map(Number);
        return Math.max(0, (h2 * 60 + m2 - h1 * 60 - m1) / 60);
    }

                return;

        }

    function renderMesJours(jours, periode) {
        if (!jours || !jours.length) {
            document.getElementById('mesjours-content').innerHTML = '<div class="error-box">Aucun jour trouvé.</div>';
            return;
        }
        const now = new Date(),
            today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const parseDMY = s => { const p=(s||'').split('/'); return p.length===3?p[2]+p[1]+p[0]:''; };
        const sorted = [...jours].filter(j => j.dateJour).sort((a, b) => parseDMY(b.dateJour).localeCompare(parseDMY(a.dateJour)));
        const passes = sorted.filter(j => {
            const p=(j.dateJour||'').split('/');
            const d = p.length===3 ? new Date(p[2],p[1]-1,p[0]) : new Date(j.dateJour);
            return new Date(d.getFullYear(), d.getMonth(), d.getDate()) <= today;
        }).slice(0, 6);
        const typeIcon = {
            travaillée: '',
            CP: '✈️',
            AT: '⚕\uFE0F'
        };
        const typeLabel = {
            travaillée: '',
            CP: 'Congé payé',
            AT: 'Arrêt travail'
        };
        const labelPeriode = (periode && periode.dateDebut && periode.dateFin)
            ? 'Du ' + periode.dateDebut + ' au ' + periode.dateFin
            : 'Période en cours';
        if (periode && periode.dateDebut && periode.dateFin)
            document.getElementById('hdr-periode').textContent = labelPeriode;
        let html = '<div class="block"><div class="block-label">Mes derniers jours</div>';
        for (const j of passes) {
            const _p=(j.dateJour||'').split('/');
            const d = _p.length===3 ? new Date(_p[2],_p[1]-1,_p[0]) : new Date(j.dateJour);
            const djour = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const isToday = djour.getTime() === today.getTime(),
                joursDepuis = Math.round((today - djour) / 86400000),
                modifiable = joursDepuis <= 5 && (j.nbModifications || 0) < 3;
            const t = j.typeJour || 'travaillée',
                nonTravaillee = t === 'CP' || t === 'AT';
            const saisi = j.c1Debut !== '' || t === 'CP' || t === 'AT';
            let statutHtml = '';
            if (!saisi)
                statutHtml = '<span style="font-size:13px;color:#c8833a;font-weight:500;">⚠️ Non saisi</span>';
            else if (nonTravaillee)
                statutHtml = '<span style="font-size:13px;color:var(--texte2);font-weight:500;">' + typeIcon[t] + ' ' + typeLabel[t] + '</span>';
            else
                statutHtml = '<span style="font-family:monospace;font-size:16px;font-weight:500;color:var(--texte2);">' + Number(j.totalHeures).toFixed(2) + 'h</span>';
            const hebdoHtml = (j.totalHebdoProg != null && j.totalHebdoProg !== '')
                ? '<div style="font-size:11px;color:var(--texte3);margin-top:2px;">sem. ' + Number(j.totalHebdoProg).toFixed(2).replace('.', ',') + ' h</div>'
                : '';
            html += '<div class="jour-item" onclick="ouvrirJourPasse(\'' + j.jourId + '\', ' + modifiable + ')">';
            html += '<span class="jour-dot ' + (saisi ? (nonTravaillee ? 'dot-special' : 'dot-ok') : 'dot-vide') + '"></span>';
            html += '<div class="jour-info"><div class="jour-nom">' + JOURS[d.getDay()] + (isToday ? ' <span style="font-size:11px;background:#e8f2e8;color:var(--vert);border-radius:8px;padding:1px 6px;">Auj.</span>' : '') + (modifiable && !isToday ? ' <span style="font-size:11px;color:var(--texte3);">✏️</span>' : '') + '</div>';
            html += '<div class="jour-date">' + d.getDate() + ' ' + MOIS[d.getMonth()] + '</div></div><div style="text-align:right">' + statutHtml + hebdoHtml + '</div></div>';
        }
        html += '</div>';
        document.getElementById('mesjours-content').innerHTML = html;
    }
    async function ouvrirJourPasse(jourId, modifiable) {
        if (jourData && jourId === jourData.jourId) {
            showVue('journee');
            return;
        }
        showVue('journee');
        document.getElementById('journee-content').innerHTML = '<div class="loader"><div class="spinner"></div>Chargement…</div>';
        try {
            const { data: jour, error } = await sb
                .from('jours')
                .select('*')
                .eq('jour_id', jourId)
                .single();
            if (error || !jour) {
                document.getElementById('journee-content').innerHTML = '<div class="error-box">Jour introuvable.</div>';
                return;
            }
            const fmtISO = iso => { if (!iso) return ''; const d = new Date(iso); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear(); };
            jourData = {
                jourId: jour.jour_id,
                dateJour: fmtISO(jour.date_jour),
                jourSemaine: jour.jour_semaine,
                periodeId: jour.periode_id,
                typeJour: jour.type_jour,
                c1Debut: jour.c1_debut || '',
                c1Fin: jour.c1_fin || '',
                c2Debut: jour.c2_debut || '',
                c2Fin: jour.c2_fin || '',
                c3Debut: jour.c3_debut || '',
                c3Fin: jour.c3_fin || '',
                commentaire: jour.commentaire || '',
                totalHeures: jour.total_heures || 0,
                nbModifications: jour.nb_modifications || 0
            };
            if (!modifiable) jourData.verrouillee = true;
            const _p = (jourData.dateJour||'').split('/');
            const dh = _p.length===3 ? new Date(_p[2],_p[1]-1,_p[0]) : new Date(jourData.dateJour);
            document.getElementById('hdr-date').textContent = JOURS[dh.getDay()] + ' ' + dh.getDate() + ' ' + MOIS[dh.getMonth()] + ' ' + dh.getFullYear();
            renderJournee();
        } catch (e) {
            document.getElementById('journee-content').innerHTML = '<div class="error-box">Impossible de charger ce jour.</div>';
        }
    }
    function showVue(nom) {
        document.querySelectorAll('.vue').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('vue-' + nom).classList.add('active');
        const nav = document.getElementById('nav-' + nom);
        if (nav)
            nav.classList.add('active');
        if (nom === 'mesjours')
            loadMesJours();
    }
    function initDrums() {
        const hEl = document.getElementById('drum-h'),
            mEl = document.getElementById('drum-m');
        if (hEl.children.length > 1)
            return;
        hEl.innerHTML = '<div class="drum-spacer"></div>';
        HOURS.forEach(h => {
            const d = document.createElement('div');
            d.className = 'drum-item';
            d.textContent = h;
            hEl.appendChild(d);
        });
        hEl.innerHTML += '<div class="drum-spacer"></div>';
        mEl.innerHTML = '<div class="drum-spacer"></div>';
        MINS.forEach(m => {
            const d = document.createElement('div');
            d.className = 'drum-item';
            d.textContent = m;
            mEl.appendChild(d);
        });
        mEl.innerHTML += '<div class="drum-spacer"></div>';
    }
    const PICKER_DEFAULTS = {
        'c1-debut': '08:00',
        'c1-fin': '12:00',
        'c2-debut': '13:00',
        'c2-fin': '17:00'
    };
    function openPicker(fieldId) {
        initDrums();
        pickerTarget = fieldId;
        const val = document.getElementById(fieldId).textContent,
            defaut = PICKER_DEFAULTS[fieldId] || '08:00';
        const h = val !== '--:--' ? val.split(':')[0] : defaut.split(':')[0],
            m = val !== '--:--' ? val.split(':')[1] : defaut.split(':')[1];
        const hi = HOURS.indexOf(h),
            mi = MINS.indexOf(m) === -1 ? 0 : MINS.indexOf(m);
        setTimeout(() => {
            document.getElementById('drum-h').scrollTop = hi * 52;
            document.getElementById('drum-m').scrollTop = mi * 52;
            updatePreview();
        }, 30);
        document.getElementById('picker-overlay').classList.add('open');
        document.getElementById('picker-popup').classList.add('open');
    }
    function updatePreview() {
        const hi = Math.round(document.getElementById('drum-h').scrollTop / 52),
            mi = Math.round(document.getElementById('drum-m').scrollTop / 52);
        document.getElementById('picker-preview').textContent = (HOURS[Math.min(hi, 23)] || '08') + ':' + (MINS[Math.min(mi, 3)] || '00');
    }
    function confirmPicker() {
        const val = document.getElementById('picker-preview').textContent;
        const btn = document.getElementById(pickerTarget);
        btn.textContent = val;
        btn.classList.remove('empty-val');
        closePicker();
    }
    function cancelPicker() {
        closePicker();
    }
    function closePicker() {
        document.getElementById('picker-overlay').classList.remove('open');
        document.getElementById('picker-popup').classList.remove('open');
    }
    initHeader();
    loadJourDuJour();
    </script>
<script>
  // PWA — enregistrement service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/suivi-temps/service-worker.js', {scope: '/suivi-temps/'})
      .then(() => console.log('SW enregistré'))
      .catch(e => console.warn('SW erreur', e));
  }

  // Mémorisation du token dans localStorage
  const urlToken = new URLSearchParams(location.search).get('id');
  if (urlToken) {
    localStorage.setItem('cdt_token', urlToken);
  } else {
    const saved = localStorage.getItem('cdt_token');
    if (saved && !location.search.includes('id=')) {
      const url = new URL(location.href);
      url.searchParams.set('id', saved);
      history.replaceState(null, '', url.toString());
    }
  }
</script>
